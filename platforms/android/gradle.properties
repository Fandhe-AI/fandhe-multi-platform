# Gradle プロジェクト最小設定（TASK-11.2-S2 / REQ-11、Issue #226）。
#
# デバッグ系フラグ（android.debug.obsoleteApi 等）・過剰な JVM 引数は追加しない
# （security.md A05「セキュリティ設定ミス」対策）。

# ビルドスクリプト・アプリコードの双方で AndroidX を前提とする
# （fandhe-egui-proxy の Android エントリが winit/android-activity 経由で
# NativeActivity を使うのみで AndroidX ライブラリ自体には依存しないが、
# AGP 9.x は本フラグを既定で要求するため明示しておく）。
android.useAndroidX=true

# Gradle デーモンのヒープ（AGP 9.x + JDK 21 での初回ビルド時の依存解決・
# .aab 生成に十分な余裕を持たせる）。
org.gradle.jvmargs=-Xmx2048m
