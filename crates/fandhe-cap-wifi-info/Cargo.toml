[package]
name = "fandhe-cap-wifi-info"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の wifi-info の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# `device_info::clean_text`（SSID の整形に使う）と Windows の電源判定 `wifi_info::radio_off`。2 機能以上が使う
# OS に触れない部品なので `fandhe-device` に残る（consumer-app-structure.md §8）。
fandhe-device = { path = "../fandhe-device" }
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

# 接続と周辺のスキャン結果（`WlanQueryInterface` など。windows.rs）。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["std", "Win32_Foundation", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi"] }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "wifi-info"

[package.metadata.fandhe.android]
# 接続情報・スキャン結果の読み取り（通常権限）と、SSID の取得に要る位置情報の実行時許可。
permissions = [
  { name = "android.permission.ACCESS_WIFI_STATE" },
  { name = "android.permission.ACCESS_FINE_LOCATION" },
  { name = "android.permission.ACCESS_COARSE_LOCATION" },
]
features = [{ name = "android.hardware.wifi", required = false }]
java = ["android/java"]

# Activity のライフサイクルへ参加する非公開 provider（FeatureLifecycleProvider、fandhe-platform-android）。
# Manifest の同じ要素と完全に一致させる（cargo-fandhe の突き合わせテストが確かめる）。
[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.WifiInfoLifecycle"
exported = false
attributes = { authorities = "${applicationId}.fandhe.wifi-info" }

[package.metadata.fandhe.macos]
frameworks = ["CoreLocation", "CoreWLAN"]
usage-descriptions = ["NSLocationUsageDescription"]

[lints]
workspace = true
