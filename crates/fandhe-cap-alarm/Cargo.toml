[package]
name = "fandhe-cap-alarm"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の alarm の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false
# iOS の Swift 薄層（AlarmKit の弱リンク・rpath）の link 指定を最終成果物へ届ける（`build.rs` の `export_link_args`）。
links = "fandhe_cap_alarm"

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

# WinRT Toast（`scenario="alarm"` のトースト）の送り手。AUMID の登録は notification の Windows 実装を使う（他機能の OS 機能を実際に使うため
# 機能 crate 同士の依存、consumer-app-structure.md §8。Windows だけで、他 OS へ notification の宣言は入らない）。
[target.'cfg(target_os = "windows")'.dependencies]
fandhe-cap-notification = { path = "../fandhe-cap-notification" }
fandhe-platform-windows = { path = "../fandhe-platform-windows" }
windows = { workspace = true, features = ["std", "Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Foundation"] }

[build-dependencies]
# iOS の Swift 薄層を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "alarm"

[package.metadata.fandhe.ios]
# AlarmKit は Swift 薄層で弱リンクする（build.rs）。説明文は最終成果物が `fandhe-app.ios.usage-descriptions` で書く。
usage-descriptions = ["NSAlarmKitUsageDescription"]

[package.metadata.fandhe.android]
java = ["android/java"]
res = ["android/res"]
# 正確な時刻の予約（API 31 以上で必須。利用者が設定で許可する）と、鳴らす通知の投稿（Android 13 以降は実行時許可。統合で 1 つになる）。
permissions = [
  { name = "android.permission.SCHEDULE_EXACT_ALARM" },
  { name = "android.permission.POST_NOTIFICATIONS" },
]

# アラームの時刻に通知を鳴らす受け口。自アプリの明示 Intent（FLAG_IMMUTABLE）だけが届くため exported=false、intent-filter なし。
# Manifest の同じ要素と完全に一致させる（cargo-fandhe の突き合わせテストが確かめる）。
[[package.metadata.fandhe.android.components]]
kind = "receiver"
name = "com.fandhe.platform.AlarmReceiver"
exported = false

[lints]
workspace = true
