[package]
name = "fandhe-cap-url-scheme"
version = "0.2.0"
edition = "2024"
description = "カスタム URL scheme の受信（fandhe://）の機能 crate。契約・effect ドライバ・OS 別実装・宣言を 1 crate に集める"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 検査・受信箱（UrlInbox など OS に触れない部品）。deep-link・file-association などと共有するため fandhe-device に残る（§23）。
fandhe-device = { path = "../fandhe-device" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

# iOS の `.m` が `fandhe_ios_app_delegate_install()`（共通層の application delegate）を呼ぶため、リンクに残す。
[target.'cfg(target_os = "ios")'.dependencies]
fandhe-platform-apple = { path = "../fandhe-platform-apple" }

# Windows の単一インスタンス転送（名前付き mutex・named pipe）とレジストリ登録。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。cargo fandhe check が検証し、統合規則に従って各 OS の設定へ反映する。
# URL 名（CFBundleURLName）はアプリの bundle id に依存するため宣言しない（任意キー）。
[package.metadata.fandhe]
id = "url-scheme"

[package.metadata.fandhe.ios]
info-plist = { CFBundleURLTypes = [{ CFBundleURLSchemes = ["fandhe"] }] }

[package.metadata.fandhe.macos]
info-plist = { CFBundleURLTypes = [{ CFBundleURLSchemes = ["fandhe"] }] }

[package.metadata.fandhe.android]
java = ["android/java"]
# `fandhe` scheme の VIEW だけ。http/https・host・path・autoVerify は付けない（受ける範囲の最小化）。
# web-auth-session も同じ filter を宣言する（統合規則で内容が同じなら 1 つ）。
main-activity-intent-filters = [
  { actions = ["android.intent.action.VIEW"], categories = ["android.intent.category.DEFAULT", "android.intent.category.BROWSABLE"], data = [{ scheme = "fandhe" }] },
]

# Activity のライフサイクルへ参加する非公開 provider（FeatureLifecycleProvider、fandhe-platform-android）。
# Manifest の同じ要素と完全に一致させる（cargo-fandhe の突き合わせテストが確かめる）。
[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.UrlSchemeLifecycle"
exported = false
attributes = { authorities = "${applicationId}.fandhe.url-scheme" }

[lints]
workspace = true
