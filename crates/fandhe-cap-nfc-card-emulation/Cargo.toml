[package]
name = "fandhe-cap-nfc-card-emulation"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の NFC カードエミュレーション（nfc-card-emulation）の機能 crate（契約・Android 実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数（finish_read / set_aid 等）を使う。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

# 機能宣言（capability-declaration.md）。現行の設定と突き合わせ済み（cargo-fandhe の tests/declarations.rs）。
# iOS は Apple の entitlement 承認待ちのため宣言しない。
[package.metadata.fandhe]
id = "nfc-card-emulation"

[package.metadata.fandhe.android]
permissions = [{ name = "android.permission.NFC" }]
features = [{ name = "android.hardware.nfc.hce", required = false }]
java = ["android/java"]
res = ["android/res"]

[[package.metadata.fandhe.android.components]]
kind = "service"
name = "com.fandhe.platform.NfcCardEmulationService"
exported = true
attributes = { permission = "android.permission.BIND_NFC_SERVICE" }
intent-filters = [{ actions = ["android.nfc.cardemulation.action.HOST_APDU_SERVICE"] }]
meta-data = [{ name = "android.nfc.cardemulation.host_apdu_service", resource = "@xml/apduservice" }]
