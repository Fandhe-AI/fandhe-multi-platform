[package]
name = "fandhe-cap-pedometer"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の歩数（pedometer）の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

# Windows.Devices.Sensors.Pedometer（`Devices_Sensors`）と、その完了通知（`windows-future`）。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Devices_Sensors", "Foundation"] }
windows-future = { workspace = true }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。`cargo fandhe check` が現行の設定と突き合わせる。
[package.metadata.fandhe]
id = "pedometer"

[package.metadata.fandhe.ios]
usage-descriptions = ["NSMotionUsageDescription"]
frameworks = ["CoreMotion"]

[package.metadata.fandhe.android]
permissions = [{ name = "android.permission.ACTIVITY_RECOGNITION" }]
java = ["android/java"]

# Activity のライフサイクルへ参加する非公開 provider（FeatureLifecycleProvider、fandhe-platform-android）。
[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.PedometerLifecycle"
exported = false
attributes = { authorities = "${applicationId}.fandhe.pedometer" }

[lints]
workspace = true
