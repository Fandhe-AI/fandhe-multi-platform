[package]
name = "fandhe-cap-background-upload"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の background-upload の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 検査（`http::check_url`）。他機能（http-get）と共有するため fandhe-device に残る。
fandhe-device = { path = "../fandhe-device" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

# iOS の `.m` が `fandhe_ios_register_background_session`（共通層の application delegate）を呼ぶため、リンクに残す。
[target.'cfg(target_os = "ios")'.dependencies]
fandhe-platform-apple = { path = "../fandhe-platform-apple" }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "background-upload"

# iOS・macOS は framework を追加しない（Foundation は基盤）。通信先の制限（ATS・`network_security_config.xml`）はアプリ側の設定で、
# 宣言に載せない（利用者の責務）。
[package.metadata.fandhe.android]
java = ["android/java"]
# WorkManager（`OneTimeWorkRequest`・`WorkInfo` の LiveData）。版は `scripts/android/versions.env` の `WORK_RUNTIME_VERSION` と一致させる。
gradle = ["androidx.work:work-runtime:2.12.0"]
# 送信（`HttpURLConnection`）。
permissions = [{ name = "android.permission.INTERNET" }]

# Activity のライフサイクルへ参加する非公開 provider（FeatureLifecycleProvider、fandhe-platform-android）。
# Manifest の同じ要素と完全に一致させる（cargo-fandhe の突き合わせテストが確かめる）。
[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.BackgroundUploadLifecycle"
exported = false
attributes = { authorities = "${applicationId}.fandhe.background-upload" }

[lints]
workspace = true
