[package]
name = "fandhe-cap-calendar"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の予定の追加（calendar）の機能 crate（iOS・macOS の EventKit・Android のカレンダーアプリ連携・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。`cargo fandhe check` が現行の設定と突き合わせる。
# iOS は `EKEventEditViewController` で追加するため usage description は要らない。
# Android はカレンダーアプリの編集画面（`ACTION_INSERT`）を開くだけで権限は使わない。
[package.metadata.fandhe]
id = "calendar"

[package.metadata.fandhe.ios]
frameworks = ["EventKit", "EventKitUI"]

[package.metadata.fandhe.macos]
usage-descriptions = ["NSCalendarsWriteOnlyAccessUsageDescription"]
frameworks = ["EventKit"]

[package.metadata.fandhe.android]
java = ["android/java"]

[lints]
workspace = true
