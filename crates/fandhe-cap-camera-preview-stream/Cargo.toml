[package]
name = "fandhe-cap-camera-preview-stream"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の camera-preview-stream の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 縮小の部品（`downscale_packed`・`downscale_yuv420`・`preview_size`）は `fandhe-cap-ar` と Web の `fandhe-web-dom` も使うため
# `fandhe-device` に残る（consumer-app-structure.md §8）。契約から再公開する。
fandhe-device = { path = "../fandhe-device" }
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

# WinRT `MediaCapture` + `MediaFrameReader`（`Media_Capture_Frames`）と `ZoomControl`（`Media_Devices`）。
# 完了の積み込みは共通層（`fandhe_platform_windows::winrt_async`）。
[target.'cfg(target_os = "windows")'.dependencies]
fandhe-platform-windows = { path = "../fandhe-platform-windows" }
windows = { workspace = true, features = [
  "std",
  "Devices_Enumeration",
  "Foundation",
  "Foundation_Collections",
  "Graphics_Imaging",
  "Media_Capture",
  "Media_Capture_Frames",
  "Media_Devices",
  "Media_MediaProperties",
  "Storage_Streams",
  "Win32_Foundation",
] }
windows-future = { workspace = true }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "camera-preview-stream"

[package.metadata.fandhe.ios]
usage-descriptions = ["NSCameraUsageDescription"]
frameworks = ["AVFoundation", "CoreMedia", "CoreVideo"]

[package.metadata.fandhe.macos]
usage-descriptions = ["NSCameraUsageDescription"]
frameworks = ["AVFoundation", "CoreMedia", "CoreVideo"]

[package.metadata.fandhe.android]
permissions = [{ name = "android.permission.CAMERA" }]
features = [
  { name = "android.hardware.camera", required = false },
  { name = "android.hardware.camera.autofocus", required = false },
  { name = "android.hardware.camera.any", required = false },
]
java = ["android/java"]

# Activity のライフサイクルへ参加する非公開 provider（FeatureLifecycleProvider、fandhe-platform-android）。
# Manifest の同じ要素と完全に一致させる（cargo-fandhe の突き合わせテストが確かめる）。
[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.CameraPreviewStreamLifecycle"
exported = false
attributes = { authorities = "${applicationId}.fandhe.camera-preview-stream" }

[lints]
workspace = true
