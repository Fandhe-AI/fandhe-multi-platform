[package]
name = "fandhe-cap-picture-in-picture"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の picture-in-picture の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。`cargo fandhe check` が現行の設定と突き合わせる。
[package.metadata.fandhe]
id = "picture-in-picture"

# AVKit の sample buffer 経路。AVKit が PiP の条件とするため `UIBackgroundModes` に audio を要する（背景での音声再生には使わない）。
[package.metadata.fandhe.ios]
frameworks = ["AVFoundation", "AVKit", "CoreMedia", "CoreVideo", "QuartzCore"]
info-plist = { UIBackgroundModes = ["audio"] }

[package.metadata.fandhe.macos]
frameworks = ["AVFoundation", "AVKit", "CoreMedia", "CoreVideo", "QuartzCore"]

# Activity ごと小窓になる。`MainActivity` の `supportsPictureInPicture` 属性は宣言から出す。
# 小窓の出入りは provider が `ComponentActivity` のリスナーで受ける（`fandhe-platform-android` の `PictureInPictureLifecycle` 参照）。
[package.metadata.fandhe.android]
main-activity-attributes = { supportsPictureInPicture = "true" }
java = ["android/java"]

# Activity のライフサイクルへ参加する非公開 provider（FeatureLifecycleProvider、fandhe-platform-android）。
# Manifest の同じ要素と完全に一致させる（cargo-fandhe の突き合わせテストが確かめる）。
[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.PictureInPictureLifecycle"
exported = false
attributes = { authorities = "${applicationId}.fandhe.picture-in-picture" }

[lints]
workspace = true
