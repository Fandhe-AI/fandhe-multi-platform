[package]
name = "fandhe-cap-on-device-llm"
version = "0.2.0"
edition = "2024"
# Apple の Swift 薄層（FoundationModels の弱リンク）のリンク指定（`-rpath` など）を最終成果物（fandhe-gallery）へ渡す。
# `cargo:rustc-link-arg` は出した package 自身の成果物にしか効かないため、`build.rs` の `export_link_args` が
# `DEP_FANDHE_CAP_ON_DEVICE_LLM_*` として公開し、gallery の `build.rs` が出し直す。
links = "fandhe_cap_on_device_llm"
description = "fandhe-multi-platform の on-device-llm の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

[build-dependencies]
# Apple の Swift 薄層を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "on-device-llm"

[lints]
workspace = true
