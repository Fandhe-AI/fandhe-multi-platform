[package]
name = "fandhe-cap-barcode-scan"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の画像内のバーコード・QR 読み取り（barcode-scan）の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 写真 1 枚の型・検証（`PickedPhoto`・`validate_photo`）と寸法の検査（`precheck_dimensions`、文字認識と共有）。
fandhe-device = { path = "../fandhe-device" }
# 完了通知の送り口（CompletionSender）・要求の追跡（RequestSlot）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

# 画像を選ばせる OS 機能（PHPicker・`NSOpenPanel`）は写真選択の機能 crate のものを使う（consumer-app-structure.md §8）。
# Android・wasm32 は読み取りの実装が無い（Web の本体は `fandhe-web-dom`。契約の純関数だけをこの crate から使う）ため依存を張らない
# （写真選択の Java helper・provider や画像復号の依存を混ぜない）。Windows・Linux は `Unsupported` を返すだけで、写真選択の宣言は無い。
[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
fandhe-cap-photo-picker = { path = "../fandhe-cap-photo-picker" }

[dev-dependencies]
# macOS の実 OS テストで PNG を作る。
image = { workspace = true }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。画像は呼び出し側が渡すバイト列で、権限は要さない。Vision は macOS・iOS で使う。
[package.metadata.fandhe]
id = "barcode-scan"

[package.metadata.fandhe.ios]
frameworks = ["Vision"]

[package.metadata.fandhe.macos]
frameworks = ["Vision"]

[lints]
workspace = true
