[package]
name = "fandhe-cap-activity-recognition"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の activity-recognition の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

# Windows.Devices.Sensors.ActivitySensor（`Devices_Sensors`）と、その完了通知（`windows-future`・`windows-core`）。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Devices_Sensors", "Foundation"] }
windows-core = { workspace = true }
windows-future = { workspace = true }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "activity-recognition"

[package.metadata.fandhe.android]
# Android 10 以降は実行時許可の対象（API 28 以下は許可不要）。
permissions = [{ name = "android.permission.ACTIVITY_RECOGNITION" }]
java = ["android/java"]
# Play services の `ActivityRecognitionClient`。版は `scripts/android/versions.env` の PLAY_SERVICES_LOCATION_VERSION と
# 一致させる（cargo-fandhe の突き合わせテストが確かめる）。
gradle = ["com.google.android.gms:play-services-location:21.4.0"]

# Activity のライフサイクルへ参加する非公開 provider（FeatureLifecycleProvider、fandhe-platform-android）。
# Manifest の同じ要素と完全に一致させる（cargo-fandhe の突き合わせテストが確かめる）。
[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.ActivityRecognitionLifecycle"
exported = false
attributes = { authorities = "${applicationId}.fandhe.activity-recognition" }

# 行動認識の配送先。自アプリの明示 PendingIntent だけが届くため exported=false、intent-filter なし。
[[package.metadata.fandhe.android.components]]
kind = "receiver"
name = "com.fandhe.platform.ActivityRecognitionReceiver"
exported = false

[package.metadata.fandhe.ios]
frameworks = ["CoreMotion"]
usage-descriptions = ["NSMotionUsageDescription"]

[lints]
workspace = true
