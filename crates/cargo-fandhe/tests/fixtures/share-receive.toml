[package.metadata.fandhe]
id = "share-receive"

# iOS の欄は実装前（#1211）。形式の確認用。
[package.metadata.fandhe.ios]
app-groups = ["share"]

[[package.metadata.fandhe.ios.extensions]]
name = "FandheShareExtension"
bundle-suffix = "share"
deployment-target = "15.0"
sources = ["apple/share"]
frameworks = ["UniformTypeIdentifiers"]
app-groups = ["share"]
info-plist = { NSExtension = { NSExtensionPointIdentifier = "com.apple.share-services" } }

[package.metadata.fandhe.macos]
info-plist = { NSServices = [{ NSMessage = "receiveShared", NSPortName = "$(EXECUTABLE_NAME)", NSSendTypes = ["public.utf8-plain-text"] }] }

[package.metadata.fandhe.android]
main-activity-intent-filters = [
  { actions = ["android.intent.action.SEND"], categories = ["android.intent.category.DEFAULT"], data = [{ mimeType = "text/plain" }] },
]
