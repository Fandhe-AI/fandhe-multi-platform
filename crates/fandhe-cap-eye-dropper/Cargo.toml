[package]
name = "fandhe-cap-eye-dropper"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の eye-dropper の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・要求追跡（RequestSlot）。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
# 契約（`eye_dropper`: PickedColor・結果コードの写像）は color-picker（未移行）と Web 実装（`fandhe-web-dom`）も
# 使うため `fandhe-device` に残してある（consumer-app-structure.md §8、capability-crate-migration.md §7）。
fandhe-device = { path = "../fandhe-device" }

[build-dependencies]
# macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。権限は不要（画面の色の取得に TCC の確認は掛からない）。
[package.metadata.fandhe]
id = "eye-dropper"

[package.metadata.fandhe.macos]
frameworks = ["AppKit"]

[lints]
workspace = true
