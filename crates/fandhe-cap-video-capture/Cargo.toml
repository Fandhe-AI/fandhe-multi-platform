[package]
name = "fandhe-cap-video-capture"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の video-capture の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

# 撮影パネル（`windows.rs`）。WinRT `MediaCapture` で録画し、`StorageFile.Properties` で長さ・寸法・向きを読む。
# 完了の積み込みは共通層（`fandhe_platform_windows::winrt_async`）。
[target.'cfg(target_os = "windows")'.dependencies]
fandhe-platform-windows = { path = "../fandhe-platform-windows" }
windows = { workspace = true, features = ["std", "Foundation", "Media_Capture", "Media_MediaProperties", "Storage", "Storage_FileProperties", "Storage_Streams", "Win32_Foundation"] }
windows-future = { workspace = true }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "video-capture"

[package.metadata.fandhe.ios]
usage-descriptions = ["NSCameraUsageDescription", "NSMicrophoneUsageDescription"]
frameworks = ["AVFoundation", "CoreMedia", "UniformTypeIdentifiers"]

[package.metadata.fandhe.macos]
usage-descriptions = ["NSCameraUsageDescription"]
frameworks = ["AVFoundation", "AppKit", "CoreMedia", "QuartzCore"]

[package.metadata.fandhe.android]
permissions = [{ name = "android.permission.CAMERA" }]
java = ["android/java"]
res = ["android/res"]

# Activity のライフサイクルへ参加する非公開 provider（FeatureLifecycleProvider、fandhe-platform-android）。
# Manifest の同じ要素と完全に一致させる（cargo-fandhe の突き合わせテストが確かめる）。
[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.VideoCaptureLifecycle"
exported = false
attributes = { authorities = "${applicationId}.fandhe.video-capture" }

# 機能専用の FileProvider。共有の `${applicationId}.compose` から分け、公開するパスを `cache/video_capture/` だけに狭める。
[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.VideoCaptureFileProvider"
exported = false
attributes = { authorities = "${applicationId}.fandhe.video-capture.files", grantUriPermissions = "true" }
meta-data = [{ name = "android.support.FILE_PROVIDER_PATHS", resource = "@xml/video_capture_file_paths" }]

[lints]
workspace = true
