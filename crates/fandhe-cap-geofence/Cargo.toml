[package]
name = "fandhe-cap-geofence"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の geofence の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 測位（共有の `SharedLocation`・再起動・失敗の写像）。機能 crate 同士の依存は全 OS（Web なし）。
fandhe-cap-location = { path = "../fandhe-cap-location" }
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "geofence"

[package.metadata.fandhe.android]
# 半径より良い精度が要る（ACCESS_FINE_LOCATION は geofence だけが求める。現行 Manifest は属性なしの 1 行）。
permissions = [{ name = "android.permission.ACCESS_FINE_LOCATION" }]

[lints]
workspace = true
