[package]
name = "fandhe-cap-volume-control"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の volume-control の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

# IAudioEndpointVolume・MMDeviceEnumerator（`Win32_Media_Audio`）と COM（`Win32_System_Com`）。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
fandhe-platform-windows = { path = "../fandhe-platform-windows" }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "volume-control"

[package.metadata.fandhe.ios]
frameworks = ["AVFoundation", "MediaPlayer"]

[package.metadata.fandhe.macos]
frameworks = ["AudioToolbox", "CoreAudio"]

[package.metadata.fandhe.android]
java = ["android/java"]

[lints]
workspace = true
