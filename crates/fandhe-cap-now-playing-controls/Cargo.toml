[package]
name = "fandhe-cap-now-playing-controls"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の now-playing-controls の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

# 再生状態の読み取り（`apple/fandhe_apple_now_playing.m` が `fandhe_apple_media_playback_snapshot` を呼ぶ）。他機能の OS 機能を
# 実際に使うため機能 crate 同士の依存（consumer-app-structure.md §8）。iOS・macOS だけで、他 OS へ宣言は入らない。
# `fandhe_cap_media_playback::platform_media_playback` を実際に参照して、リンクの対象に入れる（apple.rs）。
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
fandhe-cap-media-playback = { path = "../fandhe-cap-media-playback" }

# `SystemMediaTransportControls`（`Media`）でロック画面・メディアキーの操作を受ける（windows.rs）。ウィンドウは共通層から取る。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["std", "Foundation", "Media", "Win32_Foundation", "Win32_System_WinRT"] }
fandhe-platform-windows = { path = "../fandhe-platform-windows" }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "now-playing-controls"

[package.metadata.fandhe.ios]
frameworks = ["MediaPlayer"]

[package.metadata.fandhe.macos]
frameworks = ["MediaPlayer"]

[package.metadata.fandhe.android]
java = ["android/java"]
res = ["android/res"]
# メディア通知の投稿（Android 13 以降は実行時許可。ローカル通知・通話 UI・バッジと共有、統合で 1 つになる）。
permissions = [{ name = "android.permission.POST_NOTIFICATIONS" }]

# Activity のライフサイクルへ参加する非公開 provider（FeatureLifecycleProvider、fandhe-platform-android）。
# Manifest の同じ要素と完全に一致させる（cargo-fandhe の突き合わせテストが確かめる）。
[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.NowPlayingLifecycle"
exported = false
attributes = { authorities = "${applicationId}.fandhe.now-playing-controls" }

[lints]
workspace = true
