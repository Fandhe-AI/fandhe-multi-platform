[package]
name = "fandhe-cap-wallpaper-set"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の wallpaper-set の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }
# 検査済みの PNG（`PngImage`）と既定の置き場（`FsStorage`）は他機能（photo-save など）も使うため `fandhe-device` に残してある（consumer-app-structure.md §8）。
fandhe-device = { path = "../fandhe-device" }
# 設定する見本画像（PNG）の生成（`driver.rs` の `sample_png`）。
image = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

# `SystemParametersInfoW(SPI_SETDESKWALLPAPER)`（`windows.rs`）。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "wallpaper-set"

[package.metadata.fandhe.android]
java = ["android/java"]
permissions = [{ name = "android.permission.SET_WALLPAPER" }]

[package.metadata.fandhe.macos]
frameworks = ["AppKit"]

[lints]
workspace = true
