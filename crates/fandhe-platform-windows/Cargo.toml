[package]
name = "fandhe-platform-windows"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の Windows 共通層（メインウィンドウの HWND の保持・COM 初期化ガード・URL を既定の関連付けで開く入口・WinRT 完了をキューへ積む部品。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

# Windows 以外では空のクレート（lib.rs の cfg）。依存も Windows に限る。
# `windows` の feature は共通層が使う分だけ。機能 crate は自分が呼ぶ API の feature を自分で宣言する。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# 起動コンテキスト（HasWindowHandle 実装）から HWND を取り出す。winit は経由しない。
raw-window-handle = { workspace = true }
# WinRT 非同期操作の型（`winrt_async`）。ルート Cargo.toml の `windows-future` コメント参照。
windows-future = { workspace = true }

[lints]
workspace = true
