[package]
name = "fandhe-cap-motion-raw-sensors"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の motion-raw-sensors の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

# iOS の `.m`（`fandhe_ios_motion_raw_sensors.m`）が tilt-motion の共有 `CMMotionManager`（`fandhe_ios_shared_motion_manager` など）を
# 使う。他機能の OS 機能を実際に使うため機能 crate 同士の依存（consumer-app-structure.md §8）。iOS だけで、他 OS へ宣言は入らない。
# `fandhe_cap_tilt_motion::platform_tilt_motion` を実際に参照して、リンクの対象に入れる（ios.rs）。
[target.'cfg(target_os = "ios")'.dependencies]
fandhe-cap-tilt-motion = { path = "../fandhe-cap-tilt-motion" }

# ジャイロ・磁気・線形加速度（`Gyrometer`・`Magnetometer`・`Accelerometer`、windows.rs）。最小化の判定は共通層から受ける。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["std", "Devices_Sensors", "Foundation", "Win32_Foundation"] }
fandhe-platform-windows = { path = "../fandhe-platform-windows" }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "motion-raw-sensors"

[package.metadata.fandhe.ios]
frameworks = ["CoreMotion"]

[package.metadata.fandhe.android]
java = ["android/java"]

# Activity のライフサイクルへ参加する非公開 provider（FeatureLifecycleProvider、fandhe-platform-android）。
# Manifest の同じ要素と完全に一致させる（cargo-fandhe の突き合わせテストが確かめる）。
[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.MotionRawSensorsLifecycle"
exported = false
attributes = { authorities = "${applicationId}.fandhe.motion-raw-sensors" }

[lints]
workspace = true
