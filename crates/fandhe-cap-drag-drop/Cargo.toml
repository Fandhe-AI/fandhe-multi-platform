[package]
name = "fandhe-cap-drag-drop"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の drag-drop の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画・描画層の口（HostView）。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
# 契約（`drag_drop`: 読み取りの検証・上限）と SAF の表示名の検証（`file_picker`）。file-association（未移行）も
# 契約を使うため `fandhe-device` に残してある（consumer-app-structure.md §8、capability-crate-migration.md §7）。
fandhe-device = { path = "../fandhe-device" }

[target.'cfg(target_os = "android")'.dependencies]
# Java 側の共有基盤（FeatureLifecycleProvider）。cargo fandhe gen が Java ソースと Gradle 宣言を集める。
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

[build-dependencies]
# iOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "drag-drop"

[package.metadata.fandhe.android]
java = ["android/java"]

[package.metadata.fandhe.ios]
frameworks = ["UIKit", "UniformTypeIdentifiers"]

# Activity のライフサイクルへ参加する非公開 provider（FeatureLifecycleProvider、fandhe-platform-android）。
# Manifest の同じ要素と完全に一致させる（cargo-fandhe の突き合わせテストが確かめる）。
[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.DragDropLifecycle"
exported = false
attributes = { authorities = "${applicationId}.fandhe.drag-drop" }

[lints]
workspace = true
