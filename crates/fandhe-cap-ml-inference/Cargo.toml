[package]
name = "fandhe-cap-ml-inference"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の機械学習モデル推論（ml-inference）の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

# NNAPI（`libneuralnetworks.so`）を dlopen / dlsym で読む（JNI は使わない）。libc は Cargo.lock 済みで依存グラフは増えない。
[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

# WinML（`Windows.AI.MachineLearning`）とモデルのバイト列を渡すメモリ上のストリーム。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["AI_MachineLearning", "Foundation", "Storage_Streams", "Win32_Foundation"] }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。`cargo fandhe check` が現行の設定と突き合わせる。
# Android は NNAPI を dlopen で読むため権限・Java は不要。
[package.metadata.fandhe]
id = "ml-inference"

[package.metadata.fandhe.ios]
frameworks = ["CoreML"]

[package.metadata.fandhe.macos]
frameworks = ["CoreML"]

[lints]
workspace = true
