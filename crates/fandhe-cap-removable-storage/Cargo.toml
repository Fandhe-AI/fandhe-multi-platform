[package]
name = "fandhe-cap-removable-storage"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の removable-storage の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }
# 名前の整形（`device_info::clean_text`）は他機能も使うため `fandhe-device` に残してある（consumer-app-structure.md §8）。
fandhe-device = { path = "../fandhe-device" }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

# ボリュームの着脱通知（`WM_DEVICECHANGE`、専用スレッドの不可視ウィンドウ）と一覧の読み取り（`windows.rs`）。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "removable-storage"

[package.metadata.fandhe.android]
java = ["android/java"]

[package.metadata.fandhe.macos]
frameworks = ["AppKit"]

# Activity のライフサイクルへ参加する非公開 provider（FeatureLifecycleProvider、fandhe-platform-android）。
[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.RemovableStorageLifecycle"
exported = false
attributes = { authorities = "${applicationId}.fandhe.removable-storage" }

[lints]
workspace = true
