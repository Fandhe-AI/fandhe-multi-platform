[package]
name = "fandhe-cap-translation"
version = "0.2.0"
edition = "2024"
# Apple の Swift 薄層（Translation の弱リンク）のリンク指定を最終成果物（fandhe-gallery・fandhe-web-dom のホストテスト）へ渡す。
# `build.rs` の `export_link_args` が `DEP_FANDHE_CAP_TRANSLATION_*` として公開し、利用側の `build.rs` が出し直す。
links = "fandhe_cap_translation"
description = "fandhe-multi-platform の translation の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
# 言語タグの構文検査 `translation::valid_lang_tag`（spell-check も使う純粋なコードのため `fandhe-device` に残してある。
# consumer-app-structure.md §8）。
fandhe-device = { path = "../fandhe-device" }
thiserror = { workspace = true }

[build-dependencies]
# Apple の Swift 薄層を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "translation"

[package.metadata.fandhe.android]
java = ["android/java"]

[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.TranslationLifecycle"
exported = false
attributes = { authorities = "${applicationId}.fandhe.translation" }

[lints]
workspace = true
