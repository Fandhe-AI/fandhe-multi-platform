[package]
name = "fandhe-platform-android"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の Android 共通層（AndroidApp の保持と JNI 呼び出しの定型。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

# Android 以外では空のクレート（lib.rs の cfg）。依存も Android に限る。
[target.'cfg(target_os = "android")'.dependencies]
# AndroidApp の型を得る。winit を経由せず直接依存し、機能 crate の依存グラフに窓層を入れない。
# 版は winit が要求するものと同じ 1 つに解決される（版がずれれば set_android_app が型不一致で落ちる）。
# game-activity を自分で宣言するのは、無いと android-activity がビルドできないため。
android-activity = { workspace = true, features = ["game-activity"] }
jni = { workspace = true }

# `cargo fandhe gen` の入力。共通層も機能宣言を持つ（`fandhe-cap-*` 以外は id と crate 名の一致を求められない）。
# 機能 crate は Android の依存にこの crate を持つので、アプリの到達判定に必ず入る。
# - java: Java の共有クラス（RequestTracker・FeatureLifecycleProvider）を srcDirs に載せる（#1257）
# - gradle: Android の殻が要る基盤の Gradle 依存。アプリは自分で書かない（#1259）。
#   games-activity の版は android-activity 0.6 系（Cargo.lock）が対応する 4.4.0 に合わせる。
#   版の正本は scripts/android/versions.env で、一致は cargo-fandhe の tests/gen.rs が保証する
[package.metadata.fandhe]
id = "platform-android"

[package.metadata.fandhe.android]
java = ["android/java"]
gradle = [
    "androidx.games:games-activity:4.4.0",
    "androidx.appcompat:appcompat:1.7.1",
    "androidx.core:core:1.13.0",
    "androidx.activity:activity:1.8.0",
]
