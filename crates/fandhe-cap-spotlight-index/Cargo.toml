[package]
name = "fandhe-cap-spotlight-index"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の spotlight-index の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# OS の検索から開かれた項目の URL を受ける受信箱（`platform_url_scheme()`）。機能 crate 同士の依存（§8）。
fandhe-cap-url-scheme = { path = "../fandhe-cap-url-scheme" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

# iOS の `.m` が `fandhe_ios_app_events.h` の通知定数（`FandheScene*Notification`）・delegate の登録関数を外部参照するため、
# 共通層を通常依存にしてリンクに残す（lib.rs の `const _` が実際に参照する。build-dependencies だけでは成果物へ入らない）。
[target.'cfg(target_os = "ios")'.dependencies]
fandhe-platform-apple = { path = "../fandhe-platform-apple" }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "spotlight-index"

# Core Spotlight の framework。`NSUserActivityTypes` は使わない（検索結果の継続は `CSSearchableItemActionType` を受ける）。
[package.metadata.fandhe.ios]
frameworks = ["CoreSpotlight"]

[package.metadata.fandhe.macos]
frameworks = ["CoreSpotlight"]

[package.metadata.fandhe.android]
java = ["android/java"]

[lints]
workspace = true
