[package]
name = "fandhe-cap-ar"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の AR 表示（ar）の機能 crate（契約・iOS 実装・宣言。レンダラ非依存。Web の実装は web-dom）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }
# カメラ映像の縮小（`camera_preview_stream::{ScaledFrame, downscale_yuv420, PREVIEW_MAX_SIDE}`）と
# 待ちの追跡（`compass::{WaitTracker, NO_READING_TIMEOUT_MS}`）。OS に触れない純粋なコードで、
# 他機能（camera-preview-stream・compass）も使うため `fandhe-device` に残してある（consumer-app-structure.md §8）。
fandhe-device = { path = "../fandhe-device" }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。`cargo fandhe check` が現行の設定と突き合わせる。
# NSCameraUsageDescription は camera-capture と共有する（統合で 1 つになる）。
[package.metadata.fandhe]
id = "ar"

[package.metadata.fandhe.ios]
usage-descriptions = ["NSCameraUsageDescription"]
frameworks = ["ARKit", "AVFoundation", "CoreVideo", "UIKit"]

[lints]
workspace = true
