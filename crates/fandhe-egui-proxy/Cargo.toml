[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGPU（"wgpu" feature）は wasm32 分岐へ追加しない。WebGPU 非公開環境
# （`navigator.gpu` なし）で自動フォールバックが `panic!`（`unreachable` トラップ）で
# 失敗することを PoC-5 で確認済み（TASK-4.3 / REQ-4 / 条件 4）。"glow"
# （WebGL2、`src/web.rs` で `WebGlContextOption::WebGl2` 固定）のみを採用する。
# 方針の詳細は `docs/architecture/web-rendering-policy.md` を参照。
#
# TASK-6.2-S1（REQ-6）: "accesskit" は通常ビルドから外す（native 分岐と同じ理由。
# dev-dependencies の egui_kittest との feature 統合で `cargo test` 時のみ有効化される）。
eframe = { workspace = true, default-features = false, features = ["glow"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
# coding-rust.md 準拠: workspace 一元管理へ昇格（Issue #875 で fandhe-web-dom 側にも
# 同じ依存が増えたため、バージョンの単一管理元をルート Cargo.toml へ寄せた）。
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Document",
    "Window",
    "HtmlCanvasElement",
    # TASK-4.1（REQ-4 / M3、条件 4）: `ensure_canvas_css_size`（src/web.rs）が
    # canvas のインラインスタイル（width/height）を読み書きするために必要。
    "HtmlElement",
    "CssStyleDeclaration",
    "Response",
    "console",
] }
console_error_panic_hook = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dev-dependencies]
# Issue #1378: `android_local_fonts::family_name` の純関数テストをホストで走らせる。
ttf-parser = { workspace = true }
# egui_kittest（AccessKit ベース）で要素欠落 0 件を機械的に検証し、wgpu バックエンドで
# レンダ画像（PNG エビデンス）も取得する。
#
# Android を対象から除外する（TASK-1.5-S2 / REQ-1 / M3）: egui_kittest は
# ターゲット非依存に `egui/accesskit` feature を有効化するため、"accesskit" を
# 明示的に無効化している Android の eframe 分岐（上記コメント参照）と衝突し、
# egui-winit 側で `PlatformOutput::accesskit_update` のフィールド不整合（E0027）を
# 起こす（`cargo ndk test --lib` で実機確認済み）。Android 側の要素欠落検証は
# 実機/エミュレータでの検証（TASK-1.6）に委ねる。
egui_kittest = { workspace = true, features = ["wgpu"] }
# TASK-6.2-S1（REQ-6、docs/architecture/feature-audit.md 8 節）: 通常ビルドの各 target 分岐
# （native/iOS/wasm32）からは "accesskit" を外したため、egui_kittest（上記）が無条件に
# 有効化する egui 側の "accesskit" feature と、eframe（egui-winit 経由）側の accesskit 実装
# との間で feature 不整合（E0027、PR #306 是正）が再発しないよう、テストビルド時にのみ
# 統合される dev-dependencies として eframe 側の "accesskit" をここで明示的に有効化し直す
# （resolver = "2" の feature 統合は `cargo test` 等の対象ビルドにのみ及び、`cargo build` の
# 通常ビルドには波及しない）。Android は上記と同じ理由でこの target cfg から除外済み。
eframe = { workspace = true, default-features = false, features = ["accesskit"] }
