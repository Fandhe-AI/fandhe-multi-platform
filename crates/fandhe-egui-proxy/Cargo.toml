# `ShowShareUIForWindow`（`Win32_UI_Shell`）でウィンドウ束縛して `DataTransferManager`
# （`ApplicationModel_DataTransfer`）を呼ぶ。`Foundation` は `TypedEventHandler` /
# `Uri`、`Win32_Foundation` は `HWND` に必要。feature は加法的（coding-rust.md）で、
# `device` feature off ではこの依存自体は入らない（下記 optional + `dep:windows`）。
