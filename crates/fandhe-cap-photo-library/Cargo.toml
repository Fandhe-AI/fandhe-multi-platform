[package]
name = "fandhe-cap-photo-library"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の photo-library の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# `PngImage`（検査済みの PNG）は wallpaper-set も使う OS に触れない部品なので `fandhe-device` に残る。
fandhe-device = { path = "../fandhe-device" }
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
# 保存する見本画像（256x256 のグラデーション PNG）の生成。
image = { workspace = true }
thiserror = { workspace = true }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "photo-library"

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

# Pictures フォルダの解決は Windows 共通層の `known_folder`（`FOLDERID_Pictures` は `windows` の Shell feature）。
[target.'cfg(target_os = "windows")'.dependencies]
fandhe-platform-windows = { path = "../fandhe-platform-windows" }
windows = { workspace = true, features = ["std", "Win32_Foundation", "Win32_UI_Shell"] }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

[package.metadata.fandhe.android]
# API 28 以下の MediaStore への保存は旧実装でも非対応（API 29 以上は権限不要）。権限は現行 Manifest のとおり宣言なし。
java = ["android/java"]

[package.metadata.fandhe.ios]
frameworks = ["Photos"]
usage-descriptions = ["NSPhotoLibraryAddUsageDescription"]

[package.metadata.fandhe.macos]
frameworks = ["Photos"]
usage-descriptions = ["NSPhotoLibraryAddUsageDescription"]

[lints]
workspace = true
