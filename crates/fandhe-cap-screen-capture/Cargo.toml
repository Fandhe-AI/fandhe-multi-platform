[package]
name = "fandhe-cap-screen-capture"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の screen-capture の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

# Windows.Graphics.Capture と D3D11 によるキャプチャ、MediaTranscoder による H.264 / MP4 書き出し（windows.rs）。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["std", "Foundation", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Media_Core", "Media_MediaProperties", "Media_Transcoding", "Storage", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_UI_Shell"] }
fandhe-platform-windows = { path = "../fandhe-platform-windows" }
# `IAsyncOperation` の完了通知を受ける。
windows-future = { workspace = true }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "screen-capture"

[package.metadata.fandhe.android]
java = ["android/java"]
permissions = [
  { name = "android.permission.FOREGROUND_SERVICE" },
  { name = "android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" },
]

[package.metadata.fandhe.ios]
frameworks = ["AVFoundation"]

[package.metadata.fandhe.macos]
frameworks = ["AVFoundation"]

# MediaProjection を持つ前景サービス。自アプリの明示 Intent だけで起動するため exported = false。
# Manifest の同じ要素と完全に一致させる（cargo-fandhe の突き合わせテストが確かめる）。
[[package.metadata.fandhe.android.components]]
kind = "service"
name = "com.fandhe.platform.ScreenCaptureService"
exported = false
attributes = { foregroundServiceType = "mediaProjection" }

[lints]
workspace = true
