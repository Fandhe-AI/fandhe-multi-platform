[package]
name = "fandhe-cap-file-provider"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の file-provider の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "file-provider"

[package.metadata.fandhe.android]
java = ["android/java"]

# クラウド保存先として OS のファイル画面に出る DocumentsProvider。exported=true は DocumentsProvider の要件だが、
# MANAGE_DOCUMENTS を要求するので bind できるのは system だけ（最小公開）。Manifest の同じ要素と完全に一致させる
# （cargo-fandhe の突き合わせテストが確かめる）。新しい権限は足さない。
[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.FileProviderDocumentsProvider"
exported = true
attributes = { authorities = "${applicationId}.documents", grantUriPermissions = "true", permission = "android.permission.MANAGE_DOCUMENTS" }
intent-filters = [{ actions = ["android.content.action.DOCUMENTS_PROVIDER"] }]

[lints]
workspace = true
