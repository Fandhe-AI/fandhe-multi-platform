[package]
name = "fandhe-cap-file-preview"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の file-preview の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }
# 画像の型（`Image`）は他機能（pdf-viewer・media-playback など）も使うため `fandhe-device` に残してある（consumer-app-structure.md §8）。
fandhe-device = { path = "../fandhe-device" }
# サンプルのサムネイルを PNG にエンコードする（`driver.rs` の `sample_bytes`）。
image = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

# ファイルのプレビュー（`windows.rs`）。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["std", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "file-preview"

[package.metadata.fandhe.android]
java = ["android/java"]
res = ["android/res"]

[package.metadata.fandhe.ios]
frameworks = ["QuickLook", "QuickLookThumbnailing"]

[package.metadata.fandhe.macos]
frameworks = ["AppKit", "QuickLookThumbnailing", "QuickLookUI"]

# Activity のライフサイクルへ参加する非公開 provider（FeatureLifecycleProvider、fandhe-platform-android）。
[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.FilePreviewLifecycle"
exported = false
attributes = { authorities = "${applicationId}.fandhe.file-preview" }

# 機能専用の FileProvider。共有の `${applicationId}.compose` から分け、公開するパスを `cache/file_preview/` だけに狭める。
[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.FilePreviewFileProvider"
exported = false
attributes = { authorities = "${applicationId}.fandhe.file-preview.files", grantUriPermissions = "true" }
meta-data = [{ name = "android.support.FILE_PROVIDER_PATHS", resource = "@xml/file_preview_file_paths" }]

[lints]
workspace = true
