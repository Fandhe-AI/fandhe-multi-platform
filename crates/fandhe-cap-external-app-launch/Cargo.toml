[package]
name = "fandhe-cap-external-app-launch"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の external-app-launch の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

# 既定のブラウザ・電話・地図アプリの起動（`ShellExecuteExW`、`windows.rs`）。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "external-app-launch"

[package.metadata.fandhe.android]
java = ["android/java"]

[package.metadata.fandhe.ios]
frameworks = ["UIKit"]

[package.metadata.fandhe.macos]
frameworks = ["AppKit"]

# Activity のライフサイクルへ参加する非公開 provider（FeatureLifecycleProvider、fandhe-platform-android）。
[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.ExternalAppLaunchLifecycle"
exported = false
attributes = { authorities = "${applicationId}.fandhe.external-app-launch" }

[lints]
workspace = true
