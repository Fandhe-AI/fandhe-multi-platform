[package]
name = "fandhe-macros"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の `#[fandhe::main]`（各 OS の入口を生成する属性）。利用者は入口 crate `fandhe` 経由で使う"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 入口 crate `fandhe` と揃える（公開設定は #1216 の範囲）。
publish = false

[lib]
proc-macro = true

[dependencies]
# Cargo.lock に既にある版（wasm-bindgen・thiserror の推移依存）を使い、新しい package は増やさない。
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[lints]
workspace = true
