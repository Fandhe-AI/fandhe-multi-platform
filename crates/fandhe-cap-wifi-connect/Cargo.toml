[package]
name = "fandhe-cap-wifi-connect"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の wifi-connect の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }
# Windows の電源判定 `wifi_info::radio_off`（wifi-info と共有する純関数なので `fandhe-device` に置いてある。複製しない）。
fandhe-device = { path = "../fandhe-device" }

# WlanConnect / WlanQueryInterface（`Win32_NetworkManagement_WiFi`）と通知の登録（windows.rs）。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi"] }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "wifi-connect"

[package.metadata.fandhe.macos]
frameworks = ["CoreLocation", "CoreWLAN"]
usage-descriptions = ["NSLocationUsageDescription"]

[package.metadata.fandhe.android]
permissions = [{ name = "android.permission.CHANGE_NETWORK_STATE" }, { name = "android.permission.ACCESS_WIFI_STATE" }]
features = [{ name = "android.hardware.wifi", required = false }]
java = ["android/java"]

# Activity のライフサイクルへ参加する非公開 provider（FeatureLifecycleProvider、fandhe-platform-android）。
# Manifest の同じ要素と完全に一致させる（cargo-fandhe の突き合わせテストが確かめる）。
[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.WifiConnectLifecycle"
exported = false
attributes = { authorities = "${applicationId}.fandhe.wifi-connect" }

[lints]
workspace = true
