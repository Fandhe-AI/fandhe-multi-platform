[package]
name = "fandhe-gallery"
version = "0.1.0"
edition = "2021"
description = "画面カタログ。全機能の画面を登録し、実機確認・撮影に使う非公開アプリ（各 OS の最終成果物を持つ）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 配布しない。`docs/architecture/consumer-app-structure.md` §3。
publish = false

# 計測・デバッグ用の feature は、すべて `fandhe-egui-proxy` の同名 feature へ転送する
# （入口の切替は egui-proxy の `ios.rs`・`frame_metrics.rs` が持つ）。どれも既定 off のまま
# ストア提出物に混ざらない（security.md A05）。
[features]
frame-metrics = ["fandhe-egui-proxy/frame-metrics"]
cold-start-probe = ["fandhe-egui-proxy/cold-start-probe"]
debug-proxy-app = ["fandhe-egui-proxy/debug-proxy-app"]

# Android は cdylib（`android_main`）、Web は wasm の cdylib（`#[wasm_bindgen(start)]`）を使う。
# rlib は bin（`main.rs`）が `build_app` を使うために要る。
[lib]
name = "fandhe_gallery"
crate-type = ["cdylib", "rlib"]

# デスクトップ・iOS の実行体。bin 名を lib 名と分けるのは、wasm32 で bin/cdylib の出力ファイル名が
# 衝突すると（どちらも `fandhe_gallery.wasm` に正規化される）wasm-bindgen が bin 側の空の wasm を
# 処理して失敗するため（旧 `fandhe-egui-proxy-desktop` と同じ理由、TASK-1.2）。
[[bin]]
name = "fandhe-gallery-desktop"
path = "src/main.rs"

# `cargo fandhe gen`（#1176）の入力。説明文は利用者（このアプリ）が書く。機能 crate は文言の既定値を持たない。
# 各 OS の設定（Android の Manifest・iOS / macOS の Info.plist・entitlements）は、この欄と機能 crate の宣言から
# 生成したものだけを使う（#1194）。macOS は `build.rs` が生成して実行体へ埋め込む。
[package.metadata.fandhe-app]
app-group-prefix = "com.fandhe"

[package.metadata.fandhe-app.ios]
bundle-id = "com.fandhe.iosapp"
display-name = "Fandhe"
# 対応する言語（per-app-language の選択肢。Android は platforms/android の res/xml/locale_config.xml）。
localizations = ["ja", "en"]
# LAN 内の確認用サーバーへの接続（HTTP 取得・背景ダウンロードの動作確認）。
allows-local-networking = true

[package.metadata.fandhe-app.ios.usage-descriptions]
NSCameraUsageDescription = "型サンプル「カメラ撮影」「AR 表示」「書類スキャン」「動画の撮影」「カメラのライブ映像」「接続した機器からの取り込み」の動作確認に使います"
NSMotionUsageDescription = "型サンプル「歩数」「気圧」「行動認識」の動作確認に使います"
NSLocalNetworkUsageDescription = "型サンプル「LAN のサービス探索」「近くの端末との直接通信」「UWB による距離」の動作確認に使います"
NSNearbyInteractionUsageDescription = "型サンプル「UWB による距離」で、近くの端末までの距離を測るために使います"
NSHomeKitUsageDescription = "型サンプル「スマートホーム操作」の動作確認に使います"
NSHealthShareUsageDescription = "型サンプル「ヘルスデータ読み書き」の動作確認で、今日の歩数を読むために使います"
NSMicrophoneUsageDescription = "型サンプル「マイク録音」「音声認識」「動画の撮影」の動作確認に使います"
NSSpeechRecognitionUsageDescription = "型サンプル「音声認識」の動作確認に使います"
NSAlarmKitUsageDescription = "型サンプル「アラーム」の動作確認に使います"
NSBluetoothAlwaysUsageDescription = "型サンプル「BLE スキャン」「BLE の周辺機器役」の動作確認に使います"
NSFaceIDUsageDescription = "型サンプル「生体認証」の動作確認に使います"
NSLocationWhenInUseUsageDescription = "型サンプル「位置情報」の動作確認に使います"
NSAppleMusicUsageDescription = "型サンプル「音楽ライブラリ」の動作確認に使います"
NSPhotoLibraryAddUsageDescription = "型サンプル「写真の保存」の動作確認に使います"

# 素の実行体（非バンドル）でも TCC の許可プロンプトが出るよう、`build.rs` が確定値の Info.plist を埋め込む。
[package.metadata.fandhe-app.macos]
bundle-id = "com.fandhe.egui-proxy-desktop"
localizations = ["ja", "en"]
allows-local-networking = true

[package.metadata.fandhe-app.macos.usage-descriptions]
NSLocationUsageDescription = "型サンプル「位置情報」「Wi-Fi 情報」「指定した Wi-Fi への接続」の動作確認に使います"
NSCalendarsWriteOnlyAccessUsageDescription = "型サンプル「予定の追加」の動作確認に使います"
NSMicrophoneUsageDescription = "型サンプル「マイク録音」の動作確認に使います"
NSSpeechRecognitionUsageDescription = "型サンプル「音声認識」の動作確認に使います"
NSCameraUsageDescription = "型サンプル「カメラのライブ映像」「動画の撮影」の動作確認に使います"
NSBluetoothAlwaysUsageDescription = "型サンプル「BLE スキャン」「Bluetooth Classic」「BLE の周辺機器役」「無線の状態と切り替え」の動作確認に使います"
NSContactsUsageDescription = "型サンプル「連絡先選択」の動作確認に使います"
NSAppleMusicUsageDescription = "型サンプル「音楽ライブラリ」の動作確認に使います"
NSPhotoLibraryAddUsageDescription = "型サンプル「写真の保存」の動作確認に使います"

[build-dependencies]
# Apple のリンク指定（弱リンク・rpath）を `fandhe-egui-proxy` と機能 crate から受け取って出し直す。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }
# macOS の実行体へ埋め込む Info.plist を宣言から生成する（`build.rs`、#1194）。
cargo-fandhe = { path = "../cargo-fandhe" }

[dependencies]
fandhe-core = { path = "../fandhe-core" }
fandhe-egui-proxy = { path = "../fandhe-egui-proxy" }
fandhe-render-egui = { path = "../fandhe-render-egui" }
# `audio_play` の effect の合成（media-playback → now-playing-controls、registry.rs）が `CompletionSender` を受ける。
fandhe-runtime = { path = "../fandhe-runtime" }
egui = { workspace = true }

# 機能 crate（1 機能 1 crate、docs/architecture/consumer-app-structure.md §5）。カタログは全機能を常に載せ、
# 画面の effect ドライバとして使う。wasm32 の Web 実装は `fandhe-web-dom` 側のため入れない。
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
