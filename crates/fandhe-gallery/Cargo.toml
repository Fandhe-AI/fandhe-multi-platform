# debug システムプロパティの読み出し（`__system_property_get`、feature `debug-proxy-app`、`src/select.rs`）。
# libc は android-activity 等の推移依存で解決済みで、新しい package は増えない。
[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

# 検証アプリ（プロトタイプ・TV フォーカス）の実描画テスト（`tests/`）。Android は egui/accesskit の不整合（E0027）を
# 避けるため対象外（`fandhe-render-egui` と同じ判断）。テストビルド時だけ eframe の "accesskit" を明示する。
[target.'cfg(not(target_os = "android"))'.dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu"] }
eframe = { workspace = true, default-features = false, features = ["accesskit"] }

[lints]
workspace = true
