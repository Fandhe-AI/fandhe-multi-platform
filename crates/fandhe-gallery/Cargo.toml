[package]
name = "fandhe-gallery"
version = "0.1.0"
edition = "2021"
description = "画面カタログ。全機能の画面を登録し、実機確認・撮影に使う非公開アプリ（各 OS の最終成果物を持つ）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 配布しない。`docs/architecture/consumer-app-structure.md` §3。
publish = false

# 計測・デバッグ用の feature は、すべて `fandhe-egui-proxy` の同名 feature へ転送する
# （入口の切替は egui-proxy の `ios.rs`・`frame_metrics.rs` が持つ）。既定は `device` のみで、
# `debug-proxy-app`（画面切替の setprop 経路）・`frame-metrics`・`cold-start-probe` は既定 off のまま
# ストア提出物に混ざらない（security.md A05）。
[features]
default = ["device"]
device = [
  "fandhe-egui-proxy/device",
  # BEGIN fandhe-cap（`node scripts/device/migrate-capability.mjs sync` が書き直す。手で編集しない）
  "dep:fandhe-cap-accessibility-prefs",
  "dep:fandhe-cap-app-attest",
  "dep:fandhe-cap-app-badge",
  "dep:fandhe-cap-ar",
  "dep:fandhe-cap-audio-devices",
  "dep:fandhe-cap-calendar",
  "dep:fandhe-cap-call-ui",
  "dep:fandhe-cap-camera-capture",
  "dep:fandhe-cap-device-identifier",
  "dep:fandhe-cap-document-scan",
  "dep:fandhe-cap-drag-drop",
  "dep:fandhe-cap-dynamic-type",
  "dep:fandhe-cap-file-watch",
  "dep:fandhe-cap-focus-mode-status",
  "dep:fandhe-cap-gamepad",
  "dep:fandhe-cap-geocoding-search",
  "dep:fandhe-cap-global-hotkey",
  "dep:fandhe-cap-haptics",
  "dep:fandhe-cap-home-widget",
  "dep:fandhe-cap-http-get",
  "dep:fandhe-cap-in-app-review",
  "dep:fandhe-cap-live-activity",
  "dep:fandhe-cap-local-fonts",
  "dep:fandhe-cap-media-cast",
  "dep:fandhe-cap-media-transcode",
  "dep:fandhe-cap-midi",
  "dep:fandhe-cap-ml-inference",
  "dep:fandhe-cap-multi-display",
  "dep:fandhe-cap-nfc-card-emulation",
  "dep:fandhe-cap-nlp",
  "dep:fandhe-cap-on-device-llm",
  "dep:fandhe-cap-passkey-signin",
  "dep:fandhe-cap-pdf-viewer",
  "dep:fandhe-cap-pedometer",
  "dep:fandhe-cap-per-app-language",
  "dep:fandhe-cap-power-state",
  "dep:fandhe-cap-screen-brightness",
  "dep:fandhe-cap-screen-capture",
  "dep:fandhe-cap-screen-wake-lock",
  "dep:fandhe-cap-serial-port",
  "dep:fandhe-cap-share-receive",
  "dep:fandhe-cap-share-sheet",
  "dep:fandhe-cap-smart-home",
  "dep:fandhe-cap-sound-classification",
  "dep:fandhe-cap-spell-check",
  "dep:fandhe-cap-system-accent-color",
  "dep:fandhe-cap-system-tray",
  "dep:fandhe-cap-usb-device",
  "dep:fandhe-cap-user-idle",
  "dep:fandhe-cap-uwb-ranging",
  # END fandhe-cap
]
frame-metrics = ["fandhe-egui-proxy/frame-metrics"]
cold-start-probe = ["fandhe-egui-proxy/cold-start-probe"]
debug-proxy-app = ["fandhe-egui-proxy/debug-proxy-app"]

# Android は cdylib（`android_main`）、Web は wasm の cdylib（`#[wasm_bindgen(start)]`）を使う。
# rlib は bin（`main.rs`）が `build_app` を使うために要る。
[lib]
name = "fandhe_gallery"
crate-type = ["cdylib", "rlib"]

# デスクトップ・iOS の実行体。bin 名を lib 名と分けるのは、wasm32 で bin/cdylib の出力ファイル名が
# 衝突すると（どちらも `fandhe_gallery.wasm` に正規化される）wasm-bindgen が bin 側の空の wasm を
# 処理して失敗するため（旧 `fandhe-egui-proxy-desktop` と同じ理由、TASK-1.2）。
[[bin]]
name = "fandhe-gallery-desktop"
path = "src/main.rs"

# `cargo fandhe gen`（#1176）の入力。説明文は利用者（このアプリ）が書く。機能 crate は文言の既定値を持たない。
# 現行の手書き設定（Info.plist 等）との二重管理は、設定を生成へ切り替える #1194 までの間だけ。
# 文言は現行の `FandheIosApp/Resources/Info.plist` と同じ（一致は cargo-fandhe の tests/gen.rs が保証）。
[package.metadata.fandhe-app]
app-group-prefix = "com.fandhe"

[package.metadata.fandhe-app.ios]
bundle-id = "com.fandhe.iosapp"

[package.metadata.fandhe-app.ios.usage-descriptions]
NSCameraUsageDescription = "型サンプル「カメラ撮影」「AR 表示」「書類スキャン」「動画の撮影」「カメラのライブ映像」「接続した機器からの取り込み」の動作確認に使います"
NSMotionUsageDescription = "型サンプル「歩数」「気圧」「行動認識」の動作確認に使います"
NSLocalNetworkUsageDescription = "型サンプル「LAN のサービス探索」「近くの端末との直接通信」「UWB による距離」の動作確認に使います"
NSNearbyInteractionUsageDescription = "型サンプル「UWB による距離」で、近くの端末までの距離を測るために使います"
NSHomeKitUsageDescription = "型サンプル「スマートホーム操作」の動作確認に使います"
NSMicrophoneUsageDescription = "型サンプル「環境音の分類」の動作確認に使います"

[package.metadata.fandhe-app.macos.usage-descriptions]
NSCalendarsWriteOnlyAccessUsageDescription = "型サンプル「予定の追加」の動作確認に使います"
NSMicrophoneUsageDescription = "型サンプル「環境音の分類」の動作確認に使います"

[build-dependencies]
# Apple のリンク指定（弱リンク・rpath・Info.plist 埋め込み）を `fandhe-egui-proxy` から受け取って出し直す。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

[dependencies]
fandhe-core = { path = "../fandhe-core" }
fandhe-egui-proxy = { path = "../fandhe-egui-proxy", default-features = false }
fandhe-render-egui = { path = "../fandhe-render-egui" }
egui = { workspace = true }

# 機能 crate（1 機能 1 crate、docs/architecture/consumer-app-structure.md §5）。feature `device` のときだけ
# 画面の effect ドライバとして使う。wasm32 の Web 実装は `fandhe-web-dom` 側のため入れない。
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# BEGIN fandhe-cap（`node scripts/device/migrate-capability.mjs sync` が書き直す。手で編集しない）
fandhe-cap-accessibility-prefs = { path = "../fandhe-cap-accessibility-prefs", optional = true }
fandhe-cap-app-attest = { path = "../fandhe-cap-app-attest", optional = true }
