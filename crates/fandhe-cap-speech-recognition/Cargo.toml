[package]
name = "fandhe-cap-speech-recognition"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の speech-recognition の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
# WinRT `SpeechRecognizer`（`Media_SpeechRecognition`）と、完了待ちの `AsyncStatus`（`windows-future`）。
windows = { workspace = true, features = ["Foundation", "Media_SpeechRecognition"] }
windows-future = { workspace = true }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "speech-recognition"

[package.metadata.fandhe.ios]
usage-descriptions = ["NSSpeechRecognitionUsageDescription", "NSMicrophoneUsageDescription"]
frameworks = ["AVFoundation", "Speech"]

[package.metadata.fandhe.macos]
usage-descriptions = ["NSSpeechRecognitionUsageDescription", "NSMicrophoneUsageDescription"]
frameworks = ["AVFoundation", "Speech"]

[package.metadata.fandhe.android]
permissions = [{ name = "android.permission.RECORD_AUDIO" }]
java = ["android/java"]
# Android 11 以降のパッケージ可視性。これが無いと `SpeechRecognizer.isRecognitionAvailable` が認識サービスを見つけられない
# （action だけを宣言し、`<package>` は書かない）。
queries = [{ actions = ["android.speech.RecognitionService"] }]

[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.SpeechRecognitionLifecycle"
exported = false
attributes = { authorities = "${applicationId}.fandhe.speech-recognition" }

[lints]
workspace = true
