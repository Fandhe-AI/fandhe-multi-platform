[package]
name = "fandhe-cap-secure-credential"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の secure-credential の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
# key の許可文字集合の検査 `storage::validate_key`（未移行の storage と共有する純粋な検証。consumer-app-structure.md §8）。
fandhe-device = { path = "../fandhe-device" }
thiserror = { workspace = true }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
# `PasswordVault`・`PasswordCredential`（`Security_Credentials`）と `ERROR_NOT_FOUND`（`Win32_Foundation`）。
windows = { workspace = true, features = ["Foundation", "Security_Credentials", "Win32_Foundation"] }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "secure-credential"

[package.metadata.fandhe.ios]
frameworks = ["Security"]

[package.metadata.fandhe.macos]
frameworks = ["Security"]

# `EncryptedSharedPreferences`。版は scripts/android/versions.env の SECURITY_CRYPTO_VERSION と一致させる。
[package.metadata.fandhe.android]
java = ["android/java"]
gradle = ["androidx.security:security-crypto:1.1.0"]

[lints]
workspace = true
