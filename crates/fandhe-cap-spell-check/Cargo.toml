[package]
name = "fandhe-cap-spell-check"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の spell-check の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }
# 言語タグの検証 `translation::valid_lang_tag`（翻訳も使う純粋なコードのため `fandhe-device` に残してある。consumer-app-structure.md §8）。
fandhe-device = { path = "../fandhe-device" }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

# ISpellCheckerFactory / ISpellChecker / IEnumSpellingError（`Win32_Globalization`）、CoCreateInstance 等（`Win32_System_Com`）。
# COM の初期化ガード `ComInit` は `fandhe-platform-windows`。
[target.'cfg(target_os = "windows")'.dependencies]
fandhe-platform-windows = { path = "../fandhe-platform-windows" }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Com"] }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "spell-check"

[package.metadata.fandhe.android]
java = ["android/java"]

# Activity のライフサイクルへ参加する非公開 provider（FeatureLifecycleProvider、fandhe-platform-android）。
[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.SpellCheckLifecycle"
exported = false
attributes = { authorities = "${applicationId}.fandhe.spell-check" }

[lints]
workspace = true
