[package]
name = "fandhe-cap-lan-discovery"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の lan-discovery の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

# `.m` が network-status の `fandhe_apple_network_status_read` を呼ぶ（iOS・macOS）。Windows は `read()` を使う。
[target.'cfg(any(target_os = "ios", target_os = "macos", target_os = "windows"))'.dependencies]
fandhe-cap-network-status = { path = "../fandhe-cap-network-status" }

# `DnsServiceBrowse`（mDNS / DNS-SD、windows.rs）。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["std", "Win32_Foundation", "Win32_NetworkManagement_Dns"] }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "lan-discovery"

[package.metadata.fandhe.android]
# mDNS 応答を受ける MulticastLock 用（API 31 以下。通常権限）。
permissions = [
  # NsdManager の接続時に NsdService が INTERNET を強制する（無いと SecurityException で探索も解決もできない）。通常権限。
  { name = "android.permission.INTERNET" },
  { name = "android.permission.CHANGE_WIFI_MULTICAST_STATE" },
  # 接続中ネットワークの確認（ConnectivityManager.getActiveNetwork）用。通常権限。
  { name = "android.permission.ACCESS_NETWORK_STATE" },
]
java = ["android/java"]

# Activity のライフサイクルへ参加する非公開 provider（FeatureLifecycleProvider、fandhe-platform-android）。
# Manifest の同じ要素と完全に一致させる（cargo-fandhe の突き合わせテストが確かめる）。
[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.LanDiscoveryLifecycle"
exported = false
attributes = { authorities = "${applicationId}.fandhe.lan-discovery" }

[package.metadata.fandhe.ios]
frameworks = ["Network"]
usage-descriptions = ["NSLocalNetworkUsageDescription"]
# `_http._tcp` だけを探す。未宣言だと OS が探索を拒否する。
info-plist = { NSBonjourServices = ["_http._tcp"] }

[package.metadata.fandhe.macos]
frameworks = ["Network"]

[lints]
workspace = true
