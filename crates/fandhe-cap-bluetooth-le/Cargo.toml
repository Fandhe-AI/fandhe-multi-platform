[package]
name = "fandhe-cap-bluetooth-le"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の bluetooth-le の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

# `BluetoothLEAdvertisementWatcher`（windows.rs）。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["std", "Devices_Bluetooth", "Devices_Bluetooth_Advertisement", "Devices_Radios", "Foundation", "Win32_Foundation"] }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "bluetooth-le"

[package.metadata.fandhe.ios]
frameworks = ["CoreBluetooth"]
usage-descriptions = ["NSBluetoothAlwaysUsageDescription"]

[package.metadata.fandhe.macos]
frameworks = ["CoreBluetooth"]
usage-descriptions = ["NSBluetoothAlwaysUsageDescription"]

[package.metadata.fandhe.android]
java = ["android/java"]
# API 31 以上は `BLUETOOTH_SCAN`（位置推定には使わないため `neverForLocation`）と `BLUETOOTH_CONNECT`（接続はしないが
# `BluetoothAdapter.isEnabled()` / `BluetoothDevice.getAddress()` が機種・OS 実装によって要求しうる。同じ「付近のデバイス」グループで
# 許可ダイアログは 1 回）。API 30 以下は `BLUETOOTH`・`BLUETOOTH_ADMIN`（maxSdkVersion=30。最小権限）と `ACCESS_FINE_LOCATION`。
# `ACCESS_FINE_LOCATION` は現行 Manifest の宣言（属性なし）と一致させて宣言する（位置情報・Wi-Fi 情報と共有、統合で 1 つになる）。
# 実態は API 30 以下だけで要る権限で、`max-sdk = 30` へ狭めるのは location の機能 crate が `main` に入った後（#1331 の範囲外）。
permissions = [
  { name = "android.permission.BLUETOOTH_SCAN", flags = ["neverForLocation"] },
  { name = "android.permission.BLUETOOTH_CONNECT" },
  { name = "android.permission.BLUETOOTH", max-sdk = 30 },
  { name = "android.permission.BLUETOOTH_ADMIN", max-sdk = 30 },
  { name = "android.permission.ACCESS_FINE_LOCATION" },
]
# BLE 非搭載端末（Android TV 等）をストアの自動フィルタから除外しない。
features = [{ name = "android.hardware.bluetooth_le", required = false }]

# Activity のライフサイクルへ参加する非公開 provider（FeatureLifecycleProvider、fandhe-platform-android）。
# Manifest の同じ要素と完全に一致させる（cargo-fandhe の突き合わせテストが確かめる）。
[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.BluetoothLeLifecycle"
exported = false
attributes = { authorities = "${applicationId}.fandhe.bluetooth-le" }

[lints]
workspace = true
