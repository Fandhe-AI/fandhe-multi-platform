[package]
name = "fandhe"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の入口。使う端末機能を feature で選ぶ（契約だけを再公開する）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、依存する crate が現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[features]
default = ["egui"]
# v1 の既定バックエンド（docs/architecture/consumer-app-structure.md §7）。画面の組み立て（`fandhe::app`）を出す。
# 各 OS の入口（`#[fandhe::main]`、Issue #1200）もこの feature に含める。入口が使う OS 層・Web の glue も一緒に入る。
egui = [
    "dep:fandhe-render-egui",
    "dep:egui",
    "dep:fandhe-macros",
    "dep:fandhe-platform-android",
    "dep:winit",
    "dep:fandhe-platform-windows",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "dep:console_error_panic_hook",
]
# 端末機能。名前は対応表の id（`docs/device/capabilities/<id>.json`）で、1 機能 = 1 crate（`fandhe-cap-<id>`）。
# 選ばなかった機能は依存グラフに載らない。並びと網羅は `tests/features.rs` が検査する。
accessibility-prefs = ["dep:fandhe-cap-accessibility-prefs"]
activity-recognition = ["dep:fandhe-cap-activity-recognition"]
alarm = ["dep:fandhe-cap-alarm"]
app-attest = ["dep:fandhe-cap-app-attest"]
app-badge = ["dep:fandhe-cap-app-badge"]
