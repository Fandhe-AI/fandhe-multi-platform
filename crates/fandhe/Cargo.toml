[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android", optional = true }
winit = { workspace = true, features = ["android-game-activity"], optional = true }

# Windows の入口: 起動時のウィンドウの HWND を控える（共有シート・生体認証などの機能 crate が使う）。
[target.'cfg(target_os = "windows")'.dependencies]
fandhe-platform-windows = { path = "../fandhe-platform-windows", optional = true }

# Web の入口: wasm-bindgen の start・canvas の取得・CJK フォントの fetch。
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "Document",
    "Window",
    "HtmlCanvasElement",
    "HtmlElement",
    "CssStyleDeclaration",
    "Response",
    "console",
] }
console_error_panic_hook = { workspace = true, optional = true }

# web は対応表で n-a（専用 API の概念がない）。機能 crate が wasm32 でコンパイルできないため、wasm32 では依存させない。
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fandhe-cap-web-auth-session = { path = "../fandhe-cap-web-auth-session", optional = true }

[lints]
workspace = true
