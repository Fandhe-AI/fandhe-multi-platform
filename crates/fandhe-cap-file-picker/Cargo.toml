[package]
name = "fandhe-cap-file-picker"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の file-picker・tsv-parse の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ。`file_pick`・`tsv_import` の 2 画面を受け持つ）。
fandhe-core = { path = "../fandhe-core" }
# 他の機能（写真選択・ドラッグ & ドロップ・ファイル関連付け・フォルダ監視）も使う部品（`PickedFile`・読み取り・受け取りの検証・
# Windows のダイアログ起動）。`fandhe-device` から機能 crate へは依存させない（§7）。
fandhe-device = { path = "../fandhe-device" }
# 完了通知の送り口（CompletionSender）・要求の追跡（RequestSlot）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

# macOS の `NSOpenPanel`。Windows は rfd を使わない（`desktop.rs` の doc 参照）。Linux は依存自体を持ち込まず `Unsupported` を返す。
[target.'cfg(target_os = "macos")'.dependencies]
rfd = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

[build-dependencies]
# iOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。ファイル選択は OS のシステムピッカー（SAF・`UIDocumentPickerViewController`）で、権限は要さない。
[package.metadata.fandhe]
id = "file-picker"

[package.metadata.fandhe.ios]
frameworks = ["UniformTypeIdentifiers"]

[package.metadata.fandhe.android]
java = ["android/java"]

[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.FilePickerLifecycle"
exported = false
attributes = { authorities = "${applicationId}.fandhe.file-picker" }

[lints]
workspace = true
