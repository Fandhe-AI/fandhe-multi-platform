[package]
name = "fandhe-cap-health-data"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の health-data の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。`cargo fandhe check` が現行の設定と突き合わせる。
[package.metadata.fandhe]
id = "health-data"

# HealthKit で今日の歩数の合計を読む。書き込みはしないため NSHealthUpdateUsageDescription は足さない（最小権限）。
[package.metadata.fandhe.ios]
usage-descriptions = ["NSHealthShareUsageDescription"]
frameworks = ["HealthKit"]
entitlements = { "com.apple.developer.healthkit" = true }

# Health Connect の歩数の読み取りだけ（背景・履歴・書き込みの権限は足さない）。
[package.metadata.fandhe.android]
permissions = [{ name = "android.permission.health.READ_STEPS" }]
java = ["android/java"]

# Activity のライフサイクルへ参加する非公開 provider（FeatureLifecycleProvider、fandhe-platform-android）。
# Manifest の同じ要素と完全に一致させる（cargo-fandhe の突き合わせテストが確かめる）。
[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.HealthDataLifecycle"
exported = false
attributes = { authorities = "${applicationId}.fandhe.health-data" }

# Health Connect の許可画面から開かれる権限の理由画面。実体は exported=false で、alias は
# START_VIEW_PERMISSION_USAGE（システム専用）を要求するので起動できるのはシステムだけ。固定文言のみ表示し、Intent の extras は読まない。
[[package.metadata.fandhe.android.components]]
kind = "activity"
name = "com.fandhe.platform.HealthPermissionsRationaleActivity"
exported = false

[[package.metadata.fandhe.android.components]]
kind = "activity-alias"
name = "com.fandhe.platform.ViewPermissionUsageActivity"
exported = true
target-activity = "com.fandhe.platform.HealthPermissionsRationaleActivity"
attributes = { permission = "android.permission.START_VIEW_PERMISSION_USAGE" }
intent-filters = [{ actions = ["android.intent.action.VIEW_PERMISSION_USAGE"], categories = ["android.intent.category.HEALTH_PERMISSIONS"] }]

[lints]
workspace = true
