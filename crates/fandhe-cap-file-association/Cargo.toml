[package]
name = "fandhe-cap-file-association"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の file-association の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# `FileInbox` が使う `drag_drop::{DropError, PickedFile, read_dropped*}`・`file_picker::PickedFile`（他機能も使うため fandhe-device に残る）。
fandhe-device = { path = "../fandhe-device" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

# Windows の単一インスタンス転送（named pipe・レジストリの部品・ファイル起動の経路の口）は url-scheme が持つ。
# 他機能の OS 機能を実際に使うため機能 crate 同士の依存（consumer-app-structure.md §8）。Windows だけで、他 OS へ
# url-scheme の宣言は入らない。`SHChangeNotify`・レジストリ削除は本 crate が直接呼ぶ。
[target.'cfg(target_os = "windows")'.dependencies]
fandhe-cap-url-scheme = { path = "../fandhe-cap-url-scheme" }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }

# url-scheme の起動引数の解釈（生コマンドライン照合・フレーム）を使うテスト。
[dev-dependencies]
fandhe-cap-url-scheme = { path = "../fandhe-cap-url-scheme" }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "file-association"

# iOS・macOS の「プログラムから開く」宣言。`LSHandlerRank=Alternate` で既定アプリを奪わない。
# `LSSupportsOpeningDocumentsInPlace=false` のため OS が `Documents/Inbox/` へコピーして渡し、受信側（`.m`）が読んだ後に消す。
# `UIFileSharingEnabled` は足さない（Documents を Files に公開しない）。
[package.metadata.fandhe.ios]
info-plist = { CFBundleDocumentTypes = [{ CFBundleTypeName = "Plain Text", CFBundleTypeRole = "Viewer", LSHandlerRank = "Alternate", LSItemContentTypes = ["public.plain-text"] }], LSSupportsOpeningDocumentsInPlace = false }

[package.metadata.fandhe.macos]
info-plist = { CFBundleDocumentTypes = [{ CFBundleTypeName = "Plain Text", CFBundleTypeRole = "Viewer", LSHandlerRank = "Alternate", LSItemContentTypes = ["public.plain-text"] }] }

[lints]
workspace = true
