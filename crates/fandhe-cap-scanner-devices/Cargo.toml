[package]
name = "fandhe-cap-scanner-devices"
version = "0.2.0"
edition = "2024"
description = "fandhe-multi-platform の scanner-devices の機能 crate（契約・OS 別実装・宣言。レンダラ非依存）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-multi-platform"
# 公開対象だが、fandhe-core も現在 publish = false のため揃えている。公開設定は #1216 の範囲。
publish = false

[dependencies]
# 画面の状態関数を使う（画面の状態型を参照してよいのは driver.rs だけ）。
fandhe-core = { path = "../fandhe-core" }
# 完了通知の送り口（CompletionSender）・再描画。egui には依存しない。
fandhe-runtime = { path = "../fandhe-runtime" }
thiserror = { workspace = true }
# 取り込んだ 1 枚の検証（`photo_picker::{PickedPhoto, validate_photo, MAX_PHOTO_BYTES}`）。写真選択と共有する部品なので
# `fandhe-device` に残して参照する。
fandhe-device = { path = "../fandhe-device" }
# 2 段目の検査（復号確認）と表示用の縮小。jpeg は Cargo.lock 済みの zune-jpeg で、新しいパッケージは増えない。
image = { workspace = true, features = ["jpeg"] }

[target.'cfg(target_os = "android")'.dependencies]
fandhe-platform-android = { path = "../fandhe-platform-android" }
jni = { workspace = true }

# `ImageScanner`（`Devices_Scanners`）と機器の列挙（`Devices_Enumeration`）、その非同期操作（`windows-future`）。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Devices_Enumeration", "Devices_Scanners", "Foundation", "Storage_Streams"] }
windows-future = { workspace = true }

[build-dependencies]
# iOS・macOS の ObjC を build.rs でコンパイルする helper。通常のビルドには cc を持ち込まない。
fandhe-platform-apple = { path = "../fandhe-platform-apple", features = ["build"] }

# 機能宣言（capability-declaration.md）。権限・usage description・framework は手で足す（cargo fandhe check が検証する）。
[package.metadata.fandhe]
id = "scanner-devices"

[package.metadata.fandhe.ios]
frameworks = ["ImageCaptureCore", "ImageIO", "UniformTypeIdentifiers"]

[package.metadata.fandhe.macos]
frameworks = ["ImageCaptureCore", "ImageIO", "UniformTypeIdentifiers"]

[package.metadata.fandhe.android]
java = ["android/java"]

# Activity のライフサイクルへ参加する非公開 provider（FeatureLifecycleProvider、fandhe-platform-android）。
# Manifest の同じ要素と完全に一致させる（cargo-fandhe の突き合わせテストが確かめる）。
[[package.metadata.fandhe.android.components]]
kind = "provider"
name = "com.fandhe.platform.ScannerDevicesLifecycle"
exported = false
attributes = { authorities = "${applicationId}.fandhe.scanner-devices" }

[lints]
workspace = true
