# CI ランナー（.claude/rules/ci.md）の rustc を 1.88.0 に固定する。
#
# 背景（PR #306 CI 是正）: ランナーの `stable` は初回導入時点の 1.88.0 のまま自動更新されず
# （ci.md の「グローバル状態を汚す処理を書かない」方針により CI 側からは明示的な更新をしない）、
# 一方でローカル開発環境の `stable` は 1.96 系まで進んでいた。このバージョン差が
# trybuild（`crates/fandhe-core/tests/compile_fail/`・`error_injection/`）の
# コンパイルエラーメッセージ差分として顕在化し、rustc 1.88 でのみ 4 件の `.stderr` 不一致が
# 発生していた（`.stderr` は 1.88 の出力へ合わせて更新済み）。
#
# 本ファイルにより `.github/workflows/ci.yml` の `rustup show` と、ローカルの `cargo` 実行が
# 同一バージョンへ揃うため、以後のバージョン差起因の flaky を防ぐ
# （ci.yml のコメント「rust-toolchain.toml は TASK-1.1 側で追加予定」に対応）。
[toolchain]
channel = "1.88.0"
components = ["rustfmt", "clippy"]
