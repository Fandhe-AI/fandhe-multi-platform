# CI（.claude/rules/ci.md）とローカルの rustc を 1.99.1 に固定する。
#
# 背景（PR #306 CI 是正）: 当初はランナーの `stable` が初回導入時点の 1.88.0 のまま
# 自動更新されない一方、ローカルの `stable` が先へ進み、このバージョン差が
# trybuild（`crates/fandhe-core/tests/compile_fail/`・`error_injection/`・
# `token_typed_compile_fail/`）のコンパイルエラーメッセージ差分（`.stderr` 不一致）として
# 顕在化したため、版を固定して CI とローカルを揃えた。
#
# 版を上げた理由: cargo 同梱 tar の欠陥（CVE-2026-33056、1.94.1 で修正）と
# サードパーティレジストリのキャッシュ上書き（CVE-2026-5223、1.96.0 で修正）を含む
# 1.88.0 を使い続けないため。
#
# 版を上げる手順: 本ファイルの `channel` を変え、`TRYBUILD=overwrite cargo test -p fandhe-core
# --test compile_fail --test error_injection --test token_typed_compile_fail` で `.stderr` を
# 再生成し、差分が診断文言の変化だけであることを確認する。Dockerfile のベースイメージタグも
# 同じ版に揃える。CI は `.github/actions/ensure-rust-toolchain` が本ファイルの版を
# `rustup toolchain install` で導入する。
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
